org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.3.1 enables built-in Kotlin by default, which fatally rejects the
# org.jetbrains.kotlin.android plugin (CI run 1: "plugin is no longer required
# since AGP 9.0"). This project pins Kotlin 2.4.20 + KSP 2.3.14 + Compose/
# Serialization plugins 2.4.20 — the NexTv-proven combo in this workspace,
# which uses these same two opt-outs. Documented AGP 9 opt-outs; migration
# to built-in Kotlin is deferred (AGP 10 removes the opt-out).
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
