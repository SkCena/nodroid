name: NodRoid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Pure JVM tests
        run: gradle :core-model:test :core-engine:test --stacktrace

      - name: Android unit tests
        run: gradle :core-database:testDebugUnitTest :core-security:testDebugUnitTest :core-nodes:testDebugUnitTest :feature-canvas:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Generate release keystore and build release APK (R8)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias nodroid -keyalg RSA -keysize 2048 -validity 10000 -storepass ci-store-pass -keypass ci-key-pass -dname "CN=NodRoid CI, O=NodRoid"
          NODROID_KEYSTORE_PATH=$PWD/release.keystore NODROID_KEYSTORE_PASSWORD=ci-store-pass NODROID_KEY_ALIAS=nodroid NODROID_KEY_PASSWORD=ci-key-pass gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nodroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nodroid-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-ci-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk --title "NodRoid $TAG" --notes "NodRoid SAFE v1.0.0 CI build (commit ${{ github.sha }}). No SMS, call log, accessibility, QUERY_ALL_PACKAGES or Shizuku — those features do not exist in this build."
